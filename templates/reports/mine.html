{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="d-flex align-items-center gap-2 mb-4">
    <span class="mf-section-icon mf-section-icon--found"><i class="bi bi-person-lines-fill"></i></span>
    <h1 class="h4 mb-0">{% trans "إعلاناتي" %}</h1>
</div>

<div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-3">
    {% for report in reports %}
        {% include "reports/_card.html" %}
    {% empty %}
    <div class="col-12 text-center text-muted py-5">
        <i class="bi bi-inboxes display-4 d-block mb-2"></i>
        {% trans "لا توجد إعلانات حتى الآن." %}
    </div>
    {% endfor %}
</div>
{% include "core/_pagination.html" %}
{% endblock %}
