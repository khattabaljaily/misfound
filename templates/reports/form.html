{% extends "base.html" %}
{% load i18n %}
{% block content %}
<h1 class="h3 mb-4">
    {% if report_type == 'lost' %}{% trans "نشر إعلان مفقود" %}{% else %}{% trans "نشر إعلان معثور عليه" %}{% endif %}
</h1>

<div id="formWrapper">
    {% include "reports/_form.html" %}
</div>
{% endblock %}

{% block extra_js %}
<script>
function mfInitReportForm(root) {
    initCityCascade('id_country', 'id_city', "{% url 'reports:cities_for_country' %}");
    initChoicesOn(root || document);
    var form = (root || document).querySelector('#reportForm');
    if (!form) return;
    ajaxForm(form, {
        swapTarget: '#formWrapper',
        afterSwap: function (container) { mfInitReportForm(container); },
    });
}
mfInitReportForm(document);
</script>
{% endblock %}
