{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="d-flex align-items-center gap-2 mb-4">
    <span class="mf-section-icon mf-section-icon--found"><i class="bi bi-grid"></i></span>
    <h1 class="h4 mb-0">{% trans "تصفح الإعلانات" %}</h1>
</div>

<form method="get" class="mf-filter-bar row g-2 mb-4" id="filterForm">
    <div class="col-md-2">
        <select name="type" class="form-select" data-choices>
            <option value="">{% trans "الكل" %}</option>
            <option value="lost" {% if selected.type == 'lost' %}selected{% endif %}>{% trans "مفقود" %}</option>
            <option value="found" {% if selected.type == 'found' %}selected{% endif %}>{% trans "معثور عليه" %}</option>
        </select>
    </div>
    <div class="col-md-2">
        <select name="category" class="form-select" data-choices>
            <option value="">{% trans "جميع التصنيفات" %}</option>
            {% for c in categories %}
            <option value="{{ c.id }}" {% if selected.category == c.id|stringformat:"s" %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-2">
        <select name="country" id="id_country" class="form-select">
            <option value="">{% trans "جميع الدول" %}</option>
            {% for country in countries %}
            <option value="{{ country.id }}" {% if selected.country == country.id|stringformat:"s" %}selected{% endif %}>{{ country.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-2">
        <select name="city" id="id_city" class="form-select">
            <option value="">{% trans "جميع المدن" %}</option>
            {% for city in cities %}
            <option value="{{ city.id }}" {% if selected.city == city.id|stringformat:"s" %}selected{% endif %}>{{ city.name_ar }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-3">
        <input type="text" name="q" class="form-control" placeholder="{% trans 'بحث' %}" value="{{ selected.q }}">
    </div>
    <div class="col-md-1">
        <button class="btn btn-primary w-100">
            <span class="mf-filter-spinner d-none"><span class="mf-spinner"></span></span>
            <span class="mf-filter-label">{% trans "تصفية" %}</span>
        </button>
    </div>
</form>

<div id="results">
    {% include "reports/_results.html" %}
</div>
{% endblock %}

{% block extra_js %}
<script>
initCityCascade('id_country', 'id_city', "{% url 'reports:cities_for_country' %}", "{% trans 'جميع المدن' %}");

(function () {
    var form = document.getElementById('filterForm');
    var results = document.getElementById('results');
    var spinner = form.querySelector('.mf-filter-spinner');
    var label = form.querySelector('.mf-filter-label');

    function fetchResults(url, pushState) {
        spinner.classList.remove('d-none');
        label.classList.add('d-none');
        results.classList.add('mf-loading');

        fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
            .then(function (r) { return r.text(); })
            .then(function (html) {
                results.innerHTML = html;
                results.classList.remove('mf-loading');
                spinner.classList.add('d-none');
                label.classList.remove('d-none');
                if (pushState) window.history.pushState({}, '', url);
            })
            .catch(function () {
                results.classList.remove('mf-loading');
                spinner.classList.add('d-none');
                label.classList.remove('d-none');
                showToast('error', 'حصل خطأ في تحميل النتائج، حاول تاني.');
            });
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        var params = new URLSearchParams(new FormData(form)).toString();
        fetchResults(window.location.pathname + '?' + params, true);
    });

    form.querySelectorAll('select').forEach(function (el) {
        if (el.id === 'id_country') return; // handled separately below (must clear city first)
        el.addEventListener('change', function () { form.requestSubmit(); });
    });

    document.getElementById('id_country').addEventListener('change', function () {
        document.getElementById('id_city').value = '';
        form.requestSubmit();
    });

    window.addEventListener('popstate', function () {
        fetchResults(window.location.href, false);
    });
})();
</script>
{% endblock %}
