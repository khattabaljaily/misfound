{% extends "base.html" %}
{% load i18n %}
{% block title %}{{ meta_title }}{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-between mb-4">
    <div class="d-flex align-items-center gap-2">
        <span class="mf-section-icon mf-section-icon--found"><i class="bi bi-grid"></i></span>
        <h1 class="h4 mb-0">{% trans "تصفح الإعلانات" %}</h1>
    </div>
    <div class="mf-view-toggle" role="group">
        <button type="button" class="mf-view-toggle__btn active" id="listViewBtn"><i class="bi bi-grid"></i> {% trans "قائمة" %}</button>
        <button type="button" class="mf-view-toggle__btn" id="mapViewBtn"><i class="bi bi-geo-alt"></i> {% trans "خريطة" %}</button>
    </div>
</div>

<form method="get" class="mf-filter-bar row g-2 mb-4" id="filterForm">
    <div class="col-md-2">
        <select name="type" class="form-select" data-choices>
            <option value="">{% trans "الكل" %}</option>
            <option value="lost" {% if selected.type == 'lost' %}selected{% endif %}>{% trans "مفقود" %}</option>
            <option value="found" {% if selected.type == 'found' %}selected{% endif %}>{% trans "معثور عليه" %}</option>
        </select>
    </div>
    <div class="col-md-2">
        <select name="category" class="form-select" data-choices>
            <option value="">{% trans "جميع التصنيفات" %}</option>
            {% for c in categories %}
            <option value="{{ c.id }}" {% if selected.category == c.id|stringformat:"s" %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-2">
        <select name="country" id="id_country" class="form-select">
            <option value="">{% trans "جميع الدول" %}</option>
            {% for country in countries %}
            <option value="{{ country.id }}" {% if selected.country == country.id|stringformat:"s" %}selected{% endif %}>{{ country.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-2">
        <select name="city" id="id_city" class="form-select">
            <option value="">{% trans "جميع المدن" %}</option>
            {% for city in cities %}
            <option value="{{ city.id }}" {% if selected.city == city.id|stringformat:"s" %}selected{% endif %}>{{ city.name_ar }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-2">
        <select name="date_range" class="form-select" data-choices>
            <option value="">{% trans "كل الأوقات" %}</option>
            <option value="today" {% if selected.date_range == 'today' %}selected{% endif %}>{% trans "اليوم" %}</option>
            <option value="week" {% if selected.date_range == 'week' %}selected{% endif %}>{% trans "هذا الأسبوع" %}</option>
            <option value="month" {% if selected.date_range == 'month' %}selected{% endif %}>{% trans "هذا الشهر" %}</option>
        </select>
    </div>
    <div class="col-md-2">
        <select name="sort" class="form-select" data-choices>
            <option value="newest" {% if selected.sort == 'newest' %}selected{% endif %}>{% trans "الأحدث" %}</option>
            <option value="oldest" {% if selected.sort == 'oldest' %}selected{% endif %}>{% trans "الأقدم" %}</option>
            <option value="popular" {% if selected.sort == 'popular' %}selected{% endif %}>{% trans "الأكثر مشاهدة" %}</option>
        </select>
    </div>
    <div class="col-md-3">
        <input type="text" name="q" class="form-control" placeholder="{% trans 'بحث' %}" value="{{ selected.q }}">
    </div>
    <div class="col-md-1">
        <button class="btn btn-primary w-100">
            <span class="mf-filter-spinner d-none"><span class="mf-spinner"></span></span>
            <span class="mf-filter-label">{% trans "تصفية" %}</span>
        </button>
    </div>
</form>

<div id="mapContainer" class="mf-map-container" hidden>
    <div id="reportsMap"></div>
</div>
<div id="results">
    {% include "reports/_results.html" %}
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
initCityCascade('id_country', 'id_city', "{% url 'reports:cities_for_country' %}", "{% trans 'جميع المدن' %}");

(function () {
    var mapContainer = document.getElementById('mapContainer');
    var resultsEl = document.getElementById('results');
    var listBtn = document.getElementById('listViewBtn');
    var mapBtn = document.getElementById('mapViewBtn');
    var map = null;
    var markersLayer = null;

    function ensureMap() {
        if (map) return;
        map = L.map('reportsMap').setView([24.5, 45], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 18,
        }).addTo(map);
        markersLayer = L.layerGroup().addTo(map);
        updateMapMarkers();
    }

    function updateMapMarkers() {
        if (!markersLayer) return;
        markersLayer.clearLayers();
        var el = document.getElementById('map-points');
        var points = el ? JSON.parse(el.textContent) : [];
        var bounds = [];
        points.forEach(function (p) {
            var total = p.lost + p.found;
            var color = p.lost >= p.found ? '#ef7065' : '#16a37e';
            var icon = L.divIcon({
                className: 'mf-map-pin',
                html: '<span style="background:' + color + '"><em>' + total + '</em></span>',
                iconSize: [30, 30],
            });
            var popup = (p.lost ? ('{% trans "مفقود" %}: ' + p.lost + '<br>') : '')
                + (p.found ? ('{% trans "معثور عليه" %}: ' + p.found + '<br>') : '')
                + '<a href="' + p.url + '">' + p.name + '</a>';
            L.marker([p.lat, p.lng], { icon: icon }).bindPopup(popup).addTo(markersLayer);
            bounds.push([p.lat, p.lng]);
        });
        if (bounds.length) map.fitBounds(bounds, { padding: [30, 30], maxZoom: 10 });
    }

    listBtn.addEventListener('click', function () {
        listBtn.classList.add('active');
        mapBtn.classList.remove('active');
        mapContainer.hidden = true;
        resultsEl.hidden = false;
    });

    mapBtn.addEventListener('click', function () {
        mapBtn.classList.add('active');
        listBtn.classList.remove('active');
        resultsEl.hidden = true;
        mapContainer.hidden = false;
        ensureMap();
        setTimeout(function () { map.invalidateSize(); }, 50);
    });

    document.body.addEventListener('mf:resultsUpdated', updateMapMarkers);
})();

(function () {
    var form = document.getElementById('filterForm');
    var results = document.getElementById('results');
    var spinner = form.querySelector('.mf-filter-spinner');
    var label = form.querySelector('.mf-filter-label');
    var currentRequest = null;

    function setLoading(loading) {
        if (loading) {
            spinner.classList.remove('d-none');
            label.classList.add('d-none');
            results.classList.add('mf-loading');
        } else {
            spinner.classList.add('d-none');
            label.classList.remove('d-none');
            results.classList.remove('mf-loading');
        }
    }

    function fetchResults(url, pushState) {
        // Cancel any still-in-flight request first, so a slow earlier
        // response can never land after a newer one and show stale results.
        if (currentRequest) currentRequest.abort();
        var controller = new AbortController();
        currentRequest = controller;

        setLoading(true);

        fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' }, signal: controller.signal })
            .then(function (r) { return r.text(); })
            .then(function (html) {
                results.innerHTML = html;
                if (pushState) window.history.pushState({}, '', url);
                document.body.dispatchEvent(new Event('mf:resultsUpdated'));
            })
            .catch(function (err) {
                if (err.name === 'AbortError') return;
                showToast('error', '{% trans "حدث خطأ في تحميل النتائج، يرجى المحاولة مرة أخرى." %}');
            })
            .finally(function () {
                if (currentRequest === controller) {
                    currentRequest = null;
                    setLoading(false);
                }
            });
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        var params = new URLSearchParams(new FormData(form)).toString();
        fetchResults(window.location.pathname + '?' + params, true);
    });

    form.querySelectorAll('select').forEach(function (el) {
        if (el.id === 'id_country') return; // handled separately below (must clear city first)
        el.addEventListener('change', function () { form.requestSubmit(); });
    });

    document.getElementById('id_country').addEventListener('change', function () {
        document.getElementById('id_city').value = '';
        form.requestSubmit();
    });

    results.addEventListener('click', function (e) {
        var link = e.target.closest('.mf-pagination a');
        if (!link) return;
        e.preventDefault();
        fetchResults(link.href, true);
        results.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    window.addEventListener('popstate', function () {
        fetchResults(window.location.href, false);
    });
})();
</script>
{% endblock %}
