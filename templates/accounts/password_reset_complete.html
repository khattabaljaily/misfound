{% extends "base.html" %}
{% load i18n static %}
{% block content %}
<div class="mf-auth-panel">
    <div class="mf-auth-panel__header">
        <img src="{% static 'img/logo_white.png' %}" alt="Misfound">
        <div class="mf-auth-panel__title">{% trans "تم تغيير كلمة المرور" %}</div>
    </div>
    <div class="mf-auth-panel__body">
        <p class="text-muted mb-0">
            {% trans "تم تعيين كلمة المرور الجديدة بنجاح. يمكنك الآن تسجيل الدخول." %}
        </p>
        <p class="mt-3 text-center mb-0">
            <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100">{% trans "تسجيل الدخول" %}</a>
        </p>
    </div>
</div>
{% endblock %}
