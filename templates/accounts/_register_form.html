{% load i18n widget_tweaks %}
<form method="post" id="registerForm" class="mf-field-grid" action="{% url 'accounts:register' %}" novalidate>
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-2 {% if field|widget_type == 'textarea' %}mf-field-full{% endif %}">
        <label class="form-label">{{ field.label }}</label>
        {{ field|add_class:"form-control" }}
        {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
        {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
    </div>
    {% endfor %}
    <div class="mf-field-full">
        <button class="btn btn-primary w-100" type="submit">{% trans "إنشاء الحساب" %}</button>
    </div>
</form>
