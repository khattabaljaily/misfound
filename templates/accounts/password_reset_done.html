{% extends "base.html" %}
{% load i18n static %}
{% block content %}
<div class="mf-auth-panel">
    <div class="mf-auth-panel__header">
        <img src="{% static 'img/logo_white.png' %}" alt="Misfound">
        <div class="mf-auth-panel__title">{% trans "تحقق من بريدك الإلكتروني" %}</div>
    </div>
    <div class="mf-auth-panel__body">
        <p class="text-muted mb-0">
            {% trans "إذا كان بريدك الإلكتروني مسجلاً لدينا، فسنرسل لك رابطًا لإعادة تعيين كلمة المرور خلال دقائق." %}
        </p>
        <p class="mt-3 text-center mb-0">
            <a href="{% url 'accounts:login' %}">{% trans "العودة لتسجيل الدخول" %}</a>
        </p>
    </div>
</div>
{% endblock %}
