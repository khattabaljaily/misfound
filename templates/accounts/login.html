{% extends "base.html" %}
{% load i18n static %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-5">
<div class="text-center mb-4">
    <img src="{% static 'img/logo.png' %}" alt="Misfound" height="40">
</div>
<h1 class="h3 mb-4">{% trans "تسجيل الدخول" %}</h1>
<div id="formWrapper">
    {% include "accounts/_login_form.html" %}
</div>
<p class="mt-3 text-center">
    <a href="{% url 'accounts:register' %}">{% trans "ليس لديك حساب؟ أنشئ حسابًا جديدًا" %}</a>
</p>
</div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function mfInitLoginForm(root) {
    var form = (root || document).querySelector('#loginForm');
    if (!form) return;
    ajaxForm(form, {
        swapTarget: '#formWrapper',
        afterSwap: function (container) { mfInitLoginForm(container); },
    });
}
mfInitLoginForm(document);
</script>
{% endblock %}
