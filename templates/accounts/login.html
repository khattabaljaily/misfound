{% extends "base.html" %}
{% load i18n static %}
{% block content %}
<div class="mf-auth-panel">
    <div class="mf-auth-panel__header">
        <img src="{% static 'img/logo_white.png' %}" alt="Misfound">
        <div class="mf-auth-panel__title">{% trans "تسجيل الدخول" %}</div>
    </div>
    <div class="mf-auth-panel__body">
        <div id="formWrapper">
            {% include "accounts/_login_form.html" %}
        </div>
        <p class="mt-3 text-center mb-0">
            <a href="{% url 'accounts:register' %}">{% trans "ليس لديك حساب؟ أنشئ حسابًا جديدًا" %}</a>
        </p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function mfInitLoginForm(root) {
    var form = (root || document).querySelector('#loginForm');
    if (!form) return;
    ajaxForm(form, {
        swapTarget: '#formWrapper',
        afterSwap: function (container) { mfInitLoginForm(container); },
    });
}
mfInitLoginForm(document);
</script>
{% endblock %}
