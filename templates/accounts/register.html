{% extends "base.html" %}
{% load i18n static %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-6">
<div class="text-center mb-4">
    <img src="{% static 'img/logo.png' %}" alt="Misfound" height="40">
</div>
<h1 class="h3 mb-4">{% trans "إنشاء حساب جديد" %}</h1>
<div id="formWrapper">
    {% include "accounts/_register_form.html" %}
</div>
</div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function mfInitRegisterForm(root) {
    initCityCascade('id_country', 'id_city', "{% url 'reports:cities_for_country' %}");
    var form = (root || document).querySelector('#registerForm');
    if (!form) return;
    ajaxForm(form, {
        swapTarget: '#formWrapper',
        afterSwap: function (container) { mfInitRegisterForm(container); },
    });
}
mfInitRegisterForm(document);
</script>
{% endblock %}
