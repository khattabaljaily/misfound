{% extends "base.html" %}
{% load i18n static %}
{% block content %}
<div class="mf-auth-panel mf-auth-panel--wide">
    <div class="mf-auth-panel__header">
        <img src="{% static 'img/logo_white.png' %}" alt="Misfound">
        <div class="mf-auth-panel__title">{% trans "إنشاء حساب جديد" %}</div>
    </div>
    <div class="mf-auth-panel__body">
        <div id="formWrapper">
            {% include "accounts/_register_form.html" %}
        </div>
        <p class="mt-3 text-center mb-0">
            <a href="{% url 'accounts:login' %}">{% trans "لديك حساب بالفعل؟ سجّل الدخول" %}</a>
        </p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function mfInitRegisterForm(root) {
    initCityCascade('id_country', 'id_city', "{% url 'reports:cities_for_country' %}");
    var form = (root || document).querySelector('#registerForm');
    if (!form) return;
    ajaxForm(form, {
        swapTarget: '#formWrapper',
        afterSwap: function (container) { mfInitRegisterForm(container); },
    });
}
mfInitRegisterForm(document);
</script>
{% endblock %}
