{% load i18n widget_tweaks %}
<form method="post" id="loginForm" action="{% url 'accounts:login' %}" novalidate>
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-3">
        <label class="form-label">{{ field.label }}</label>
        {{ field|add_class:"form-control" }}
        {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
    </div>
    {% endfor %}
    {% for error in form.non_field_errors %}<div class="text-danger small mb-3">{{ error }}</div>{% endfor %}
    <button class="btn btn-primary w-100" type="submit">{% trans "تسجيل الدخول" %}</button>
</form>
