{% load i18n static %}
<!DOCTYPE html>
<html lang="{% get_current_language as MF_LANG %}{{ MF_LANG }}" dir="{% get_current_language_bidi as MF_BIDI %}{% if MF_BIDI %}rtl{% else %}ltr{% endif %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "حدث خطأ غير متوقع" %} | Misfound</title>
    {% if MF_BIDI %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    {% else %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    {% endif %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'css/misfound.css' %}">
    <link rel="icon" type="image/png" href="{% static 'img/icon.png' %}">
</head>
<body>
    <main class="container my-4">
        <a href="/" class="mf-brand d-flex justify-content-center mb-4">
            <img src="{% static 'img/logo.png' %}" alt="Misfound" style="height: 32px;">
        </a>
        <div class="mf-error-page">
            <div class="mf-error-page__icon"><i class="bi bi-cone-striped"></i></div>
            <div class="mf-error-page__code">500</div>
            <h1>{% trans "حدث خطأ غير متوقع" %}</h1>
            <p>{% trans "نعتذر، حدث خطأ من جانبنا. يرجى المحاولة مرة أخرى بعد قليل." %}</p>
            <div class="mf-error-page__actions">
                <a href="/" class="btn btn-primary"><i class="bi bi-house-door"></i> {% trans "العودة للرئيسية" %}</a>
            </div>
        </div>
    </main>
</body>
</html>
