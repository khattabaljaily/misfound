<div class="mb-2 d-flex {% if message.sender == user %}justify-content-end{% endif %}">
    <div class="p-2 rounded {% if message.sender == user %}bg-primary text-white{% else %}bg-light{% endif %}" style="max-width: 70%;">
        <div>{{ message.body }}</div>
        <div class="small opacity-75">{{ message.created_at|date:"H:i" }}</div>
    </div>
</div>
