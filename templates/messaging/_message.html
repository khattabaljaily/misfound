<div class="mf-message-row {% if message.sender == user %}mf-message-row--mine{% endif %}">
    <div class="mf-message-avatar"><i class="bi bi-person-fill"></i></div>
    <div class="mf-message-bubble">
        <div class="mf-message-body">{{ message.body }}</div>
        <div class="mf-message-time">{{ message.created_at|date:"H:i" }}</div>
    </div>
</div>
